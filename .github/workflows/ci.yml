name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements/base.txt -r requirements/dev.txt
      - run: python -m unittest discover -s tests -q
      - run: python -m compileall -q src tests scripts
      - run: python -m ruff check src tests scripts
      - run: python scripts/check_repo.py --require-git

  classifier-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements/base.txt -r requirements/classifier-cpu.txt -r requirements/dev.txt
      - run: python -m mypy src/ai_exam_monitoring scripts/check_repo.py
      # Fixture phần mềm tự sinh; không dùng dataset thật, tải weights hoặc GPU.
      - run: python -m unittest discover -s tests -p 'test_training*.py' -q
