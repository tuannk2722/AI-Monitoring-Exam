# Đề xuất R8 có điều kiện, không config download/trainer/release đã duyệt.
status: draft_conditional_expansion_plan
owner: repository-owner
parent_review: artifacts/reports/pilot-b-v7-targeted-20261008/review-pointer-final.json
quality_review: outputs/v7-owner-review-r5-20261009/review-proposals.jsonl
training_eligible: false
release_approved: false
materialize_final_release: false
holdout_model_inference: false
candidate_count_requirement: null
actual_new_r8_candidate_yield: 0
r8_acquisition_executed: false
independent_group_gain_measured: null
priority_order:
  - desk_phone_positive_negative_classroom_exam
  - looking_positive_negative_same_camera_workarea
  - crowded_attribution_and_cooccurrence
  - phone_small_partial_variation_after_input224_qa
source_priority:
  classroom_exam: [classroom_attitude, student_behaviour, exam_cheating_keaor, scb_head, scb_hrw, roboflow_v1]
  public_auxiliary: [openimages_train_prefix, coco_2017_train]
eligibility_conditions:
  original_split: [train, train2017]
  parent_and_evaluation_graph: phải qua graph review, không chỉ SHA khác
  unused_independent_groups: có bằng chứng camera/room/session/lineage; thiếu thì pending
  source_and_annotation_pins: bắt buộc version/path/checksum rõ
  phone_positive: mobile được xác minh và liên kết trực tiếp đúng người/own desk
  phone_negative: tay/vùng bàn của anchor đủ quan sát, không dùng thiếu annotation
  looking_positive_negative: có anchor/head và own workarea; tilt/group activity không tự P
  evidence_at_224: lưu source/crop/input224, đánh giá qualitative; không threshold pixel mới
  public_rights: kiểm creator/title/photo/license/notice; blocked record ngoài primary
matching_priority: [same_image_distinct_person, same_scene_verified, same_session_verified]
context_only_pairs_count_as_session_matched: false
openimages_selective_continuation:
  metadata_scope: annotation train chưa scan, không validation/test
  complete_image_groups: không cắt image cuối khi xử lý Range/chunk
  phone_candidate_filters: [person_and_mobile_bbox, person_mobile_desk_or_paper_or_keyboard_context]
  looking_negative_filters: [person_and_workarea_with_hands_visible]
  optional_caption_title_hints: chỉ ranking, không label hoặc bằng chứng camera/session
  retain_unannotated_device_cases: phải visual review, không suy N
  remaining_supply_status: unknown_useful_pool_not_exhausted
coco_selective_continuation:
  metadata_scope: train2017 đã pin
  targeted_filters: person_cellphone_workarea_or_crowd, matched_workarea_negatives
  avoid: product_only, hand_only, context_only_mobile_ownership, easy_negative_refill
stop_policy:
  no_unused_independent_groups: blocked_group_evidence_or_exhausted_verified_groups
  no_visual_target_evidence: exhausted_audited_stratum_only_if_exhaustively_screened
  unknown_license_path_version: quarantine_record
  ambiguous_device_gaze: U hoặc review_only, không refill P/N
report_contract:
  funnel: total_pool/scanned/downloaded/visually_screened/proposed/rejected/duplicates/caps/remaining
  counts_status: measured/estimated/unknown; exhaustion cần evidence riêng
  yield_and_diversity: actual mới, source/camera/room/group gains, không crop count thay independence
  shortage: phân biệt P/N đúng domain, matching, workarea, cooccurrence và input224 evidence
pending_decisions:
  - id: TBD-R8-GROUP-EVIDENCE
    owner: repository-owner
    reason: Source hiện có nhiều hint nhưng chưa chứng minh nhóm camera/session mới.
    resolve_when: Owner review graph/components và evidence source/session trước chọn split.
  - id: TBD-R8-PUBLIC-NOTICE
    owner: repository-owner
    reason: Metadata license đủ không tự kiểm đầy đủ notices/other rights.
    resolve_when: Nghiệm thu ledger/notice/use scope của ảnh shortlist mới.
