use_scope_limits:
- Local offline classifier train/validation/final evaluation only after owner acceptance
  and new canonical release.
- Keep source attribution and derivative notes; no redistribution or external media
  upload/logging.
- Research/demo only; no disciplinary decisions.
- Runtime detector/context crop gate remains separate before end-to-end baseline.
limitations:
- Visual conservative clusters are not recovered room/session/person metadata; residual
  leakage uncertainty requires owner boundary review.
- No classifier metrics or independent exam-like holdout demonstrated.
- RF phone positives and SCB phone negatives are source-confounded; small val/test
  support cannot establish real-exam generalization.
- Unassigned records remain in the 112-member ledger but cannot enter training/evaluation.
