selection_principles:
- Ưu tiên cảnh/người/camera mới và positive/negative trong cùng nguồn/ngữ cảnh.
- Không đưa họ hàng của val50/test11 hoặc nguồn holdout vào train.
- Không nhận crop toàn unknown; không dùng label nguồn hoặc phone bbox thay person.
- Không coi augmented frame, SHA unique hoặc nhiều người cùng frame là cảnh độc lập.
- Phone trên bàn vẫn positive khi liên kết đúng người; không đổi thành negative vì không cầm.
- Nhãn/crop/group nghi vấn chỉ sửa trong version mới được owner duyệt; parent giữ nguyên.
- Thiếu bucket cần thiết ghi shortage, không refill bằng ảnh dễ hoặc tự tách group.
